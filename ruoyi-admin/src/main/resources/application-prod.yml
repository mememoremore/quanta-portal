# Enable with SPRING_PROFILES_ACTIVE=druid,prod
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    com.ruoyi: info

# Quanta Pages（成员静态站点托管）在生产通过环境变量启用，不在此文件填写真实值：
#   QT_PAGES_ENABLED=true          启用前先完成 CORS_ALLOWED_ORIGINS 精确化与 TOKEN_REFRESH_SECURE=true
#   QT_PAGES_GITHUB_TOKEN=...      服务端 GitHub Token，只从环境变量注入
#   QT_PAGES_ROOT_DIR=/srv/quanta-pages
# 其余容量/时限参数沿用 application.yml 的 qt.pages 默认值，可按需用 QT_PAGES_* 覆盖。
