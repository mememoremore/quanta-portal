name: Backend CI

on:
  push:
    paths:
      - 'pom.xml'
      - 'ruoyi-*/**'
      - 'sql/**'
      - '.code_deploy/pages/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'pom.xml'
      - 'ruoyi-*/**'
      - 'sql/**'
      - '.code_deploy/pages/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Pages 的隔离 MySQL 集成测试（QtPagesMySqlTest）：
      # 仅在 QUANTA_PAGES_MYSQL_TEST=true 时执行，连接 127.0.0.1:33367 的一次性测试库
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: qt_pages_test
        ports:
          - 33367:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      QUANTA_PAGES_MYSQL_TEST: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp verify
